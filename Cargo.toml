[package]
name = "WhisperTunnel"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = { version = "0.3.32", features = ["sink"] }
rustls = "0.23.37"
tokio = { version = "1.50.0", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
uuid = { version = "1.22.0", features = ["v4"] }
async-trait = "0.1.88"
anyhow = "1.0"
chrono = { version = "0.4.44", features = ["serde"] }
axum = { version = "0.8.8", features = ["json"] }
jsonwebtoken = "10.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
envy = "0.4.2"
dotenvy = "0.15.7"
sha2 = "0.11.0-pre.5"
rand = "0.9.2"
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "chrono", "macros", "sqlx-macros"] }
futures = "0.3.31"
